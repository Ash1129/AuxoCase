<!doctype html>
<html lang="en"{% if theme in ('light', 'dark') %} data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{{ 'light' if theme == 'light' else ('dark' if theme == 'dark' else 'light dark') }}">
<title>Not your page · AuxoCase</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&amp;family=Lora:ital,wght@0,400..600;1,400..600&amp;display=swap">
<style>
:root{--bg:#F3F2F2;--ink:#201F1D;--muted:#605D5D;--line:#201F1D29;--accentInk:#7D5411;--heading:"Cormorant Garamond","Cormorant Garamond Fallback",Georgia,serif;--body:Lora,"Lora Fallback",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1A1919;--ink:#F3F1E8;--muted:#AEABA3;--line:#F3F1E838;--accentInk:#E1AD66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1919;--ink:#F3F1E8;--muted:#AEABA3;--line:#F3F1E838;--accentInk:#E1AD66;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/24px var(--body)}
main{max-width:640px;margin:0 auto;padding:48px 24px}
.brand{font-family:var(--heading);font-size:26px;line-height:30px;font-weight:600;margin:0 0 32px}
h1{font-family:var(--heading);font-size:44px;line-height:48px;font-weight:600;margin:0 0 12px}
p{margin:0 0 12px}a{color:var(--accentInk)}a:hover{color:var(--ink)}.muted{color:var(--muted)}
</style>
</head>
<body>
<main>
  <p class="brand">AuxoCase</p>
  <h1>Not your page</h1>
  <p>{{ why[:1]|upper }}{{ why[1:] }}.</p>
  <p class="muted">You are logged in as {{ name }} ({{ role }}). <a href="{{ home }}">Back to your own pages</a>, or <a href="/login">log in as someone else</a>.</p>
</main>
</body>
</html>
