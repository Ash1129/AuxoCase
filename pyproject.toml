[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auxocase"
version = "0.1.0"
description = "AuxoCase: predictive lead scoring, capacity-aware routing and an outcome feedback loop for HubSpot (BrightPath Payroll case)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
