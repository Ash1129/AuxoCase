[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auxocase"
version = "0.1.0"
description = "AuxoCase: predictive lead scoring, capacity-aware routing and an outcome feedback loop for HubSpot (BrightPath Payroll case)."
requires-python = ">=3.11"
# Pinned to the versions the model pickles were written with; Vercel installs these (it reads this file before
# requirements.txt, which repeats them for `pip install -r` and adds pytest).
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.0",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "anthropic",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
